name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deb:
    name: deb (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-24.04
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4

      - name: Check the tag matches debian/changelog
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          version=$(dpkg-parsechangelog -S Version)
          test "v$version" = "$GITHUB_REF_NAME" || {
            echo "Tag $GITHUB_REF_NAME does not match debian/changelog version $version" >&2
            exit 1
          }

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential debhelper libusb-1.0-0-dev pkgconf python3 systemd systemd-dev udev lintian
          # Fails if the list above has drifted from debian/control.
          dpkg-checkbuilddeps

      - name: Build package (runs make check)
        run: dpkg-buildpackage -us -uc -b

      - name: Lint package
        run: lintian --fail-on error --info ../blue-yeti-autoreset_*.deb

      - name: Collect package
        run: |
          mkdir dist
          mv ../blue-yeti-autoreset_*.deb dist/
          dpkg-deb --info dist/*.deb
          dpkg-deb --contents dist/*.deb

      - uses: actions/upload-artifact@v4
        with:
          name: deb-${{ matrix.arch }}
          path: dist/*.deb
          if-no-files-found: error

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: deb
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      id-token: write
      attestations: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: deb-*
          merge-multiple: true
          path: dist

      - name: Checksums
        working-directory: dist
        run: sha256sum *.deb > SHA256SUMS

      - uses: actions/attest-build-provenance@v2
        with:
          subject-path: dist/*.deb

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" dist/* \
            --repo "$GITHUB_REPOSITORY" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes
